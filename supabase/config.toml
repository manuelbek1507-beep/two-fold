project_id = "2fold"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset"]
enable_signup = true            # signups are still gated by the allowed_emails trigger
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_confirmations = true
double_confirm_changes = true

[auth.password]
minimum_length = 10

[functions.turn-credentials]
verify_jwt = true

[functions.send-push]
verify_jwt = false   # called by a Database Webhook; protected by PUSH_WEBHOOK_SECRET
